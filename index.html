<div class="container">
  <div class="row">
    <div class="col-sm-4">
      <form class="form" id="pageSearchForm" autocomplete="off">
        <input type="text" id="pageSearchInput" placeholder="Search pages.." name="search">
        <button type="submit"><i class="fa fa-search"></i></button>
      </form>
      <div id="suggestions" class="list-group position-absolute"></div>
      <p id="noResults" style="display:none;">No pages found.</p>
    </div>
  </div>
</div>
<script>
	
function myFunction() {
     var element = document.body;
      element.classList.toggle("dark-mode");
      }

  document.addEventListener("DOMContentLoaded", function () {

  
  const pages = [
    { name: "Home", url: "home.html", keywords: "home start main welcome" },
    { name: "About", url: "about.html", keywords: "about us info history" },
    { name: "Gallery", url: "gallery.html", keywords: "gallery photos images pictures" },
    { name: "Services", url: "services.html", keywords: "services tours offers" },
    { name: "Contact", url: "contact.html", keywords: "contact email phone address" }
  ];

  const form = document.getElementById("pageSearchForm");
  const input = document.getElementById("pageSearchInput");
  const suggestions = document.getElementById("suggestions");
  const noResults = document.getElementById("noResults");

  input.addEventListener("input", function () {

    let searchText = input.value.toLowerCase().trim();

    suggestions.innerHTML = "";
    noResults.style.display = "none";

    for (let i = 0; i < pages.length; i++) {

      let pageText =
        (pages[i].name + " " + pages[i].keywords).toLowerCase();

     
      if (searchText !== "" && pageText.includes(searchText)) {

        let link = document.createElement("a");
        link.href = pages[i].url;
        link.className = "list-group-item list-group-item-action";
        link.textContent = pages[i].name;

        suggestions.appendChild(link);
      }
    }
  });

  form.addEventListener("submit", function (event) {

    event.preventDefault();

    let searchText = input.value.toLowerCase().trim();
    let pageFound = false;

    
    for (let i = 0; i < pages.length; i++) {

      let pageText =
        (pages[i].name + " " + pages[i].keywords).toLowerCase();

      if (pageText.includes(searchText)) {
        pageFound = true;

        window.location.href = pages[i].url;
        break;
      }
    }

    if (!pageFound) {
      suggestions.innerHTML = "";
      noResults.style.display = "block";
    }
  });

  document.addEventListener("click", function (event) {

    if (
      !form.contains(event.target) &&
      !suggestions.contains(event.target)
    ) {
      suggestions.innerHTML = "";
    }
  });

});
</script>
