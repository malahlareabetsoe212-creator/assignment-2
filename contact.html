   </div>

   <div class="mb-3">

   </div>

   	</div>

   	<div class="mb-3">
   		<label class="form-label" for="message">Message</label>

   	<div class="invalid-feedback"></div>
   </div>

   	<button class="button" type="submit">Send Message</button>
   </form>
   <div id="contactMsg" class="mt-3" role="status"></div>

</div>

<script>
  const pages = [
    "home.html",
    "about.html",
    "gallery.html",
    "services.html",
    "contact.html"
  ];

  document.addEventListener("DOMContentLoaded", () => {
    const currentFile = window.location.pathname.split("/").pop() || "home.html";
    const currentIndex = pages.indexOf(currentFile);

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    prevBtn.disabled = currentIndex <= 0;
    nextBtn.disabled = currentIndex === -1 || currentIndex >= pages.length - 1;

    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) {
        window.location.href = pages[currentIndex - 1];
      }
    });

    nextBtn.addEventListener("click", () => {
      if (currentIndex !== -1 && currentIndex < pages.length - 1) {
        window.location.href = pages[currentIndex + 1];
      }
    });
  });
	function myFunction() {
		var element = document.body;
		element.classList.toggle("dark-mode");
	}

	function showPassword(){
		var x = document.getElementById('pswd');

		if (x.type==="password"){
			x.type="text";
		}else{
			x.type="password"
		}
		
	}
</script>
